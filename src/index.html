<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <title>Apex Performance Shop</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Odjeća i oprema Apex Performance – shop studija za osobni i funkcionalni trening.">
  <meta name="theme-color" content="#0034C4">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Link previews of the shop; products share their own page (api/shop/share/...). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Apex Performance Shop">
  <meta property="og:title" content="Apex Performance Shop">
  <meta property="og:description" content="Odjeća i oprema studija Apex Performance. Dostava u BoxNow paketomat diljem Hrvatske.">
  <meta property="og:image" content="https://apex-performance.fit/assets/images/logo_light_theme.png">
  <!-- Intro of the Apex Performance app (splash.mp4 from iOS and Android), once per visit. -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      background: #090b0d;
      visibility: hidden;
      transition: opacity 0.35s ease-out;
    }
    #splash.shown {
      visibility: visible;
    }
    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    #splash video {
      width: min(72vw, 380px);
      aspect-ratio: 1;
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <video src="splash.mp4" muted playsinline preload="auto"></video>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('splash');
      var video = splash.querySelector('video');
      var seen = false;
      try {
        seen = sessionStorage.getItem('apex-splash') === '1';
      } catch (e) {}

      // Never to visitors who turned animations off, and once per visit at most.
      if (seen || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        splash.remove();
        return;
      }

      // The page is there once the app has drawn something.
      function ready() {
        var root = document.querySelector('app-root');
        return !!root && root.children.length > 0;
      }

      var done = false;
      function finish() {
        if (done) return;
        done = true;
        video.pause();
        splash.classList.add('hide');
        setTimeout(function () { splash.remove(); }, 400);
      }

      // Shown only when loading takes longer than this; a fast load shows nothing.
      setTimeout(function () {
        if (ready()) {
          splash.remove();
          return;
        }
        try {
          sessionStorage.setItem('apex-splash', '1');
        } catch (e) {}

        var shownAt = Date.now();
        splash.classList.add('shown');
        video.addEventListener('ended', finish);
        video.addEventListener('error', finish);
        var playing = video.play();
        if (playing && playing.catch) playing.catch(finish);

        // Gone once the page is ready, but not sooner than a short moment, so it doesn't flash.
        var check = setInterval(function () {
          if (done) return clearInterval(check);
          if (ready() && Date.now() - shownAt >= 900) {
            clearInterval(check);
            finish();
          }
        }, 100);
        // Longest the splash may stay when the video doesn't play.
        setTimeout(finish, 4000);
      }, 400);
    })();
  </script>
  <app-root></app-root>
</body>
</html>
